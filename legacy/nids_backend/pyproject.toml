[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nids"
version = "0.2.0"
description = "Network intrusion detection backend (UNSW-NB15): ANN + random forest, novelty layer, explanations, HTTP service"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scikit-learn", "joblib"]

[project.optional-dependencies]
test = ["pytest"]
parquet = ["pyarrow"]

[project.scripts]
nids = "nids.cli:main"

[tool.setuptools]
packages = ["nids"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: trains models on the full dataset (deselect with -m 'not slow')"]
